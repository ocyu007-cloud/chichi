<!doctype html>
<html>
<head>
<meta charset="utf8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>도면으로 물량 계산 — 레미go</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme: light;
  --bg:#f2f3f5; --surface:#fff; --surface-2:#f6f7f9; --line:#e4e6eb; --line-2:#d3d7de;
  --ink:#15181e; --ink-2:#3a404b; --muted:#6b7280;
  --accent:#e8620c; --accent-2:#c24f07; --accent-soft:#fff0e5;
  --ok:#157a3c;
  --r:14px; --r-sm:10px;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
  --font:"IBM Plex Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
.muted{color:var(--muted)} .sm{font-size:13px}
:focus-visible{outline:3px solid rgba(232,98,12,.45);outline-offset:2px}

.page{max-width:460px;margin:0 auto;padding:24px 16px 60px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.card-head h2,.card-head h3{font-size:16px}

.field{display:flex;flex-direction:column;gap:5px;min-width:0;border:0;margin:0;padding:0}
input[type=number],input[type=text],select{width:100%;min-height:44px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:#fff;padding:9px 11px;font-size:16px;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(232,98,12,.15)}
.unit-input{position:relative;display:flex}
.unit-input input{padding-right:42px}
.unit-input em{position:absolute;right:11px;top:50%;transform:translateY(-50%);font-style:normal;color:var(--muted);font-size:14px;pointer-events:none}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:359px){.grid-2{grid-template-columns:1fr}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:#fff;color:var(--ink);font-weight:700;font-size:15px;transition:background .15s;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-2)}
.btn.ghost{background:transparent}
.btn.sm{min-height:34px;padding:0 12px;font-size:13.5px}

.calcx-result{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--accent-soft);border-radius:var(--r-sm);padding:10px 12px;margin-top:4px;font-size:13.5px}
.calcx-result b{font-size:16px}
.calcx-canvas-wrap{position:relative;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface-2);margin-top:10px;overflow:auto;touch-action:none}
.calcx-canvas-wrap canvas{display:block;cursor:crosshair;max-width:100%}
.calcx-ocr-badges{position:absolute;top:0;left:0;pointer-events:none}
.calcx-hero{border:1.5px solid var(--accent);box-shadow:0 2px 14px rgba(232,98,12,.12)}
.calcx-upload{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;border:2px dashed var(--accent);border-radius:var(--r);background:var(--accent-soft);padding:26px 16px;cursor:pointer;transition:background .15s,border-color .15s}
.calcx-upload:hover,.calcx-upload:active{background:#ffe4cc;border-color:var(--accent-2)}
.calcx-upload-icon{font-size:28px;line-height:1}
.calcx-upload-main{font-size:15px;font-weight:800;color:var(--ink)}
.calcx-upload-sub{font-size:12.5px;color:var(--muted)}
.calcx-manual{margin-top:14px;border-top:1px dashed var(--line-2);padding-top:10px}
.calcx-manual summary{font-size:12.5px;color:var(--muted);cursor:pointer;font-weight:600;list-style:none}
.calcx-manual summary::-webkit-details-marker{display:none}
.calcx-manual summary::before{content:"▸ ";}
.calcx-manual[open] summary::before{content:"▾ ";}
.calcx-dims{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line-2)}
.calcx-scale-row{display:flex;gap:8px}
</style>
</head>
<body>
<div class="page">

  <div class="card calcx calcx-hero">
    <div class="card-head"><h3>📐 도면으로 물량 계산</h3></div>
    <p class="muted sm" style="margin:0 0 12px">도면 이미지를 올리면 면적을 인식해서 필요한 레미콘 물량까지 한 번에 계산해요.</p>

    <label class="calcx-upload" id="cx-upload-label" for="cx-plan-file">
      <input type="file" id="cx-plan-file" accept="image/*" style="display:none">
      <span class="calcx-upload-icon">📐</span>
      <span class="calcx-upload-main">도면 이미지 업로드</span>
      <span class="calcx-upload-sub">탭해서 사진을 선택하거나 촬영하세요</span>
    </label>

    <div class="calcx-canvas-wrap" id="cx-canvas-wrap" hidden>
      <canvas id="cx-canvas"></canvas>
      <div class="calcx-ocr-badges" id="cx-ocr-badges"></div>
    </div>
    <p class="sm muted" id="cx-plan-status" hidden></p>
    <p class="sm muted" id="cx-plan-hint-auto" hidden>지금은 <b id="cx-step-label">가로</b> 차례예요. <b id="cx-step-label2">가로</b> 치수가 적힌 부분만 사각형으로 <b>드래그</b>하세요. 숫자가 여러 구간이면 전부 더해요.</p>
    <div class="calcx-dims" id="cx-dims" hidden>
      <div class="grid-2">
        <label class="field"><span class="lbl">가로</span><span class="unit-input"><input id="cx-box-w" type="number" inputmode="decimal" min="0"><em>mm</em></span></label>
        <label class="field"><span class="lbl">세로</span><span class="unit-input"><input id="cx-box-h" type="number" inputmode="decimal" min="0"><em>mm</em></span></label>
      </div>
      <div class="calcx-scale-row">
        <button type="button" class="btn ghost sm" id="cx-box-redo">다시 선택</button>
        <button type="button" class="btn primary sm" id="cx-box-calc">이 치수로 면적 계산</button>
      </div>
    </div>
    <div class="calcx-result" id="cx-plan-result" hidden>
      <span>선택 영역 면적 <b id="cx-plan-area-out">0</b> m²</span>
      <button type="button" class="btn sm" id="cx-plan-apply-btn">계산기에 반영</button>
    </div>
    <p class="sm muted" id="cx-plan-help" hidden>* 인식이 부정확하면 위 가로·세로 값을 직접 고쳐서 계산할 수 있어요. 숫자가 안 잡히면 드래그 영역을 조금 더 넉넉하게 잡아보세요.</p>

    <div class="grid-2" style="margin-top:14px">
      <label class="field"><span class="lbl">타설 두께</span>
        <select id="cx-thick">
          <option value="100">100 mm</option>
          <option value="120">120 mm</option>
          <option value="150" selected>150 mm</option>
          <option value="180">180 mm</option>
          <option value="200">200 mm</option>
        </select>
      </label>
      <label class="field"><span class="lbl">여유율</span>
        <select id="cx-margin">
          <option value="3">3%</option>
          <option value="5" selected>5%</option>
          <option value="8">8%</option>
          <option value="10">10%</option>
        </select>
      </label>
    </div>

    <div class="calcx-result" id="cx-result" hidden>
      <span><b id="cx-vol-out">0</b> m³ 필요 · 약 <b id="cx-truck-out">0</b>대 분량</span>
      <button type="button" class="btn sm" id="cx-apply-btn">물량에 반영</button>
    </div>

    <details class="calcx-manual">
      <summary>면적을 이미 알고 있어요 (직접 입력)</summary>
      <label class="field" style="margin-top:10px"><span class="lbl">시공 면적</span><span class="unit-input"><input id="cx-area" type="number" inputmode="decimal" min="0" step="1" placeholder="예: 180"><em>m²</em></span></label>
      <button type="button" class="btn ghost sm" id="cx-calc-btn" style="width:100%">이 면적으로 계산</button>
    </details>
  </div>

</div>

<script>
/* 타설 물량 계산기 + 도면 OCR 면적 산출 — order.html 의 같은 기능을 그대로 분리한 것. */
(function () {
  'use strict';
  var TRUCK_CAP = 6; // m³ / 대

  var neededVolume = 0;

  function $id(id) { return document.getElementById(id); }

  function calcVolume() {
    var area = parseFloat(($id('cx-area') || {}).value) || 0;
    var thick = parseFloat(($id('cx-thick') || {}).value) || 0;
    var margin = parseFloat(($id('cx-margin') || {}).value) || 0;
    var vol = area * (thick / 1000) * (1 + margin / 100);
    neededVolume = Math.round(vol * 10) / 10;
    var trucks = Math.max(1, Math.ceil(neededVolume / TRUCK_CAP));
    var volOut = $id('cx-vol-out'), truckOut = $id('cx-truck-out'), box = $id('cx-result');
    if (volOut) volOut.textContent = neededVolume.toFixed(1);
    if (truckOut) truckOut.textContent = trucks;
    if (box) box.hidden = false;
  }

  function applyVolumeToOrder() {
    var f = $id('f-volume');
    if (!f || !neededVolume) return;
    f.value = neededVolume;
    f.dispatchEvent(new Event('input', { bubbles: true }));
  }

  /* ---------- 도면 박스 인식 (드래그 → 영역 OCR → 가로·세로 자동 추출) ---------- */
  var MAX_W = 340;
  var img = null, natW = 0, natH = 0, dispScale = 1;
  var dragging = false;
  var dragStart = null;
  var curBox = null; // {x0,y0,x1,y1} 캔버스 좌표
  var lastAreaM2 = 0;

  function setPlanStatus(msg) {
    var el = $id('cx-plan-status');
    if (!el) return;
    el.hidden = !msg;
    el.textContent = msg || '';
  }

  function redrawPlan() {
    var canvas = $id('cx-canvas');
    if (!canvas || !img) return;
    var ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    if (curBox) {
      var x = Math.min(curBox.x0, curBox.x1), y = Math.min(curBox.y0, curBox.y1);
      var w = Math.abs(curBox.x1 - curBox.x0), h = Math.abs(curBox.y1 - curBox.y0);
      ctx.strokeStyle = '#e8620c';
      ctx.lineWidth = 2;
      ctx.setLineDash([5, 4]);
      ctx.strokeRect(x, y, w, h);
      ctx.setLineDash([]);
      ctx.fillStyle = 'rgba(232,98,12,.12)';
      ctx.fillRect(x, y, w, h);
    }
  }

  function canvasPos(evt, canvas) {
    var rect = canvas.getBoundingClientRect();
    var cx = (evt.touches ? evt.touches[0].clientX : evt.clientX) - rect.left;
    var cy = (evt.touches ? evt.touches[0].clientY : evt.clientY) - rect.top;
    return { x: cx, y: cy };
  }

  function loadTesseract(cb) {
    if (window.Tesseract) { cb(); return; }
    var s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
    s.onload = function () { cb(); };
    s.onerror = function () { cb(new Error('load-failed')); };
    document.head.appendChild(s);
  }

  /* 박스(캔버스 좌표)를 원본 해상도로 크롭해서 오프스크린 캔버스로 돌려준다 (OCR 정확도용) */
  function cropBoxToCanvas(box) {
    var x = Math.min(box.x0, box.x1), y = Math.min(box.y0, box.y1);
    var w = Math.abs(box.x1 - box.x0), h = Math.abs(box.y1 - box.y0);
    var sx = x / dispScale, sy = y / dispScale, sw = w / dispScale, sh = h / dispScale;
    var pad = 6; // 여백을 조금 둬서 잘린 숫자를 살린다
    sx = Math.max(0, sx - pad); sy = Math.max(0, sy - pad);
    sw = Math.min(natW - sx, sw + pad * 2); sh = Math.min(natH - sy, sh + pad * 2);
    var scaleUp = sw < 260 ? Math.min(4, 260 / sw) : 2; // 작은 영역은 더 키워서 인식률을 올린다
    var out = document.createElement('canvas');
    out.width = Math.round(sw * scaleUp);
    out.height = Math.round(sh * scaleUp);
    var octx = out.getContext('2d');
    octx.imageSmoothingEnabled = false;
    octx.drawImage(img, sx, sy, sw, sh, 0, 0, out.width, out.height);
    return out;
  }

  function sumLabel(list) {
    if (!list.length) return null;
    var total = list.reduce(function (a, b) { return a + b; }, 0);
    return { total: total, label: list.join('+') + (list.length > 1 ? ' = ' + total : '') };
  }

  /* 캔버스를 90도 회전한 새 캔버스를 돌려준다 (세로 치수는 도면에서 보통 눕혀 써 있음) */
  function rotateCanvas90(src, clockwise) {
    var out = document.createElement('canvas');
    out.width = src.height;
    out.height = src.width;
    var ctx = out.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    if (clockwise) { ctx.translate(out.width, 0); ctx.rotate(Math.PI / 2); }
    else { ctx.translate(0, out.height); ctx.rotate(-Math.PI / 2); }
    ctx.drawImage(src, 0, 0);
    return out;
  }

  function ocrCanvasForNumbers(canvas) {
    return Tesseract.createWorker('eng').then(function (worker) {
      return worker.setParameters({ tessedit_char_whitelist: '0123456789xX*,. ' }).then(function () {
        return worker.recognize(canvas.toDataURL());
      }).then(function (res) {
        worker.terminate();
        var text = (res && res.data && res.data.text) || '';
        var cleaned = text.replace(/(\d)[,.](?=\d)/g, '$1');
        var matches = cleaned.match(/\d{2,6}/g) || [];
        return matches.map(function (v) { return parseInt(v, 10); }).filter(function (v) { return v >= 10; });
      });
    });
  }

  /* variants를 순서대로 시도하다가 숫자를 찾으면 멈춘다. 세로는 도면에서 글자가
     눕혀 있는 경우가 많아서 시계/반시계로 돌려본 뒤 원본도 시도한다. */
  function runOcrVariants(cropped, variants, i, cb) {
    var canvas = variants[i] === 'cw' ? rotateCanvas90(cropped, true)
      : variants[i] === 'ccw' ? rotateCanvas90(cropped, false)
      : cropped;
    ocrCanvasForNumbers(canvas).then(function (nums) {
      if (nums.length || i >= variants.length - 1) cb(nums);
      else runOcrVariants(cropped, variants, i + 1, cb);
    }).catch(function () {
      if (i >= variants.length - 1) cb([]);
      else runOcrVariants(cropped, variants, i + 1, cb);
    });
  }

  /* 위치 추측 없이, 사용자가 드래그한 박스 안 숫자를 전부 인식해서 더한다.
     첫 드래그는 가로, 그다음 드래그는 세로 — 순서대로 자동 진행된다. */
  var nextField = 'w';

  function updateStepHint() {
    var label = nextField === 'w' ? '가로' : '세로';
    var l1 = $id('cx-step-label'), l2 = $id('cx-step-label2');
    if (l1) l1.textContent = label;
    if (l2) l2.textContent = label;
  }

  function runBoxOcr(box) {
    var field = nextField;
    var fieldLabel = field === 'w' ? '가로' : '세로';
    setPlanStatus(fieldLabel + ' 영역에서 숫자를 인식하는 중이에요...');
    loadTesseract(function (err) {
      if (err || !window.Tesseract) {
        setPlanStatus('OCR을 불러오지 못했어요. 아래 값을 직접 입력해주세요.');
        showDim(field, null);
        return;
      }
      var cropped = cropBoxToCanvas(box);
      var variants = field === 'h' ? ['cw', 'ccw', 'plain'] : ['plain'];
      runOcrVariants(cropped, variants, 0, function (nums) {
        var s = sumLabel(nums);
        if (s) {
          showDim(field, s.total);
          nextField = field === 'w' ? 'h' : 'w';
          updateStepHint();
          setPlanStatus(fieldLabel + ' ' + s.label + 'mm 로 인식했어요. 이제 ' + (nextField === 'w' ? '가로' : '세로') + ' 차례예요. 틀렸으면 아래에서 고쳐주세요.');
        } else {
          setPlanStatus('선택한 영역에서 숫자를 찾지 못했어요. 드래그 영역을 조금 더 넉넉하게 잡아보거나 아래에 직접 입력해주세요.');
          showDim(field, null);
        }
      });
    });
  }

  function showDim(mode, val) {
    var dims = $id('cx-dims');
    if (dims) dims.hidden = false;
    var input = $id(mode === 'w' ? 'cx-box-w' : 'cx-box-h');
    if (input) input.value = val != null ? val : '';
    var help = $id('cx-plan-help'); if (help) help.hidden = false;
  }

  function calcBoxArea() {
    var w = parseFloat(($id('cx-box-w') || {}).value) || 0;
    var h = parseFloat(($id('cx-box-h') || {}).value) || 0;
    if (!w || !h) { setPlanStatus('가로·세로 값을 모두 입력해주세요.'); return; }
    lastAreaM2 = Math.round((w / 1000) * (h / 1000) * 100) / 100;
    var out = $id('cx-plan-area-out'), box = $id('cx-plan-result');
    if (out) out.textContent = lastAreaM2;
    if (box) box.hidden = false;
    setPlanStatus('');
  }

  function resetBoxSelection() {
    curBox = null;
    var dims = $id('cx-dims'); if (dims) dims.hidden = true;
    var pr = $id('cx-plan-result'); if (pr) pr.hidden = true;
    var wIn = $id('cx-box-w'); if (wIn) wIn.value = '';
    var hIn = $id('cx-box-h'); if (hIn) hIn.value = '';
    nextField = 'w';
    updateStepHint();
    setPlanStatus('');
    redrawPlan();
  }

  /* ---------- 이벤트 위임 ---------- */
  document.addEventListener('click', function (e) {
    var t = e.target;

    if (t.closest('#cx-calc-btn')) { calcVolume(); return; }
    if (t.closest('#cx-apply-btn')) { applyVolumeToOrder(); return; }
    if (t.closest('#cx-box-calc')) { calcBoxArea(); return; }
    if (t.closest('#cx-box-redo')) { resetBoxSelection(); return; }

    if (t.closest('#cx-plan-apply-btn')) {
      if (!lastAreaM2) return;
      var areaInput = $id('cx-area');
      if (areaInput) areaInput.value = lastAreaM2;
      calcVolume();
      return;
    }
  });

  document.addEventListener('change', function (e) {
    if (e.target && e.target.id === 'cx-plan-file') {
      var file = e.target.files && e.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function (ev) {
        img = new Image();
        img.onload = function () {
          natW = img.naturalWidth; natH = img.naturalHeight;
          dispScale = Math.min(1, MAX_W / natW);
          var canvas = $id('cx-canvas');
          if (!canvas) return;
          canvas.width = Math.round(natW * dispScale);
          canvas.height = Math.round(natH * dispScale);
          var wrap = $id('cx-canvas-wrap'); if (wrap) wrap.hidden = false;
          var hint = $id('cx-plan-hint-auto'); if (hint) hint.hidden = false;
          resetBoxSelection();
          redrawPlan();
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    }
  });

  document.addEventListener('mousedown', function (e) {
    var canvas = $id('cx-canvas');
    if (!canvas || e.target !== canvas || !img) return;
    dragging = true;
    dragStart = canvasPos(e, canvas);
    curBox = { x0: dragStart.x, y0: dragStart.y, x1: dragStart.x, y1: dragStart.y };
    redrawPlan();
  });
  document.addEventListener('mousemove', function (e) {
    if (!dragging) return;
    var canvas = $id('cx-canvas');
    if (!canvas) return;
    var p = canvasPos(e, canvas);
    curBox.x1 = p.x; curBox.y1 = p.y;
    redrawPlan();
  });
  document.addEventListener('mouseup', function () {
    if (!dragging) return;
    dragging = false;
    if (!curBox) return;
    var w = Math.abs(curBox.x1 - curBox.x0), h = Math.abs(curBox.y1 - curBox.y0);
    if (w < 8 || h < 8) { curBox = null; redrawPlan(); return; }
    runBoxOcr(curBox);
  });
})();
</script>
